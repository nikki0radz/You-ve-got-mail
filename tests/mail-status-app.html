  <style>
    #app-loading{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:14px;padding:28px;text-align:center;background:var(--mm-bg,#fff9ed);color:var(--mm-text,#203936);font:800 21px/1.4 PostalBaloo,system-ui}
    #app-loading .boot-spinner{width:42px;height:42px;border:4px solid #a1c6bc;border-top-color:#365a40;border-radius:50%;animation:spin 1s linear infinite}
    #app-loading button{padding:10px 24px;background:#365a40;color:#fff9e8;border:0;border-radius:24px;font:inherit}
    @media(prefers-reduced-motion:reduce){#app-loading .boot-spinner{animation:none}}
  </style>
  <div id="app-loading" role="status" aria-live="polite"><span class="boot-spinner" aria-hidden="true"></span><span data-boot-message>Opening the post office…</span><button type="button" hidden onclick="location.reload()">Try again</button></div>
  <main id="app" class="mm-phone" aria-label="You've Got Mail" aria-busy="true" inert></main>
  <script>setTimeout(function(){var screen=document.getElementById('app-loading');if(!screen)return;var app=document.getElementById('app');if(app.childElementCount){screen.remove();app.inert=false;app.removeAttribute('aria-busy');}else{screen.querySelector('[data-boot-message]').textContent='The post office could not open. Please try again.';screen.querySelector('.boot-spinner').hidden=true;screen.querySelector('button').hidden=false;}},12000);</script>
  <dialog id="flow" aria-labelledby="flow-title"></dialog>
  <dialog id="mail-window" aria-label="Mailbox"></dialog>
  <dialog id="social-flow" aria-label="Pigeon post"></dialog>
  <dialog id="parcel-shop" aria-label="Pick and post"></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
  <script>
(()=>{
 document.documentElement.dataset.workroom='true';
 const originalStorage=localStorage,prefix='pigeon.status-fixture.';
 Object.defineProperty(window,'localStorage',{value:{getItem:k=>originalStorage.getItem(prefix+k),setItem:(k,v)=>originalStorage.setItem(prefix+k,v),removeItem:k=>originalStorage.removeItem(prefix+k)}});
 localStorage.setItem('pigeon.main-art.owner','FIXTURE');
 localStorage.setItem('youve-got-mail-draft-v1',JSON.stringify({version:1,theme:new URLSearchParams(location.search).get('theme')||'dark',profile:{name:'Nicole'},friends:[],inbox:[],scheduled:[]}));
 const now=Date.now(),seen=new URLSearchParams(location.search).get('case')==='seen';
 const receipt={sentAt:now-300000,deliveredAt:now-290000,lockedNotificationAt:now-280000,...(seen?{seenAt:now-60000}:{}),status:'acknowledged'};
 const book={me:{code:'123456789A'},friends:[{name:'Owen',code:'ABCDEF1234',mode:'open',photo:'assets/home/owen.webp',settings:{notifications:true,popups:true,warning:true,onUnlock:true,replyNotifications:true,precise:true,push:'connected'},lastContactAt:now-20000,settingsAt:now-100000},{name:'Sophie',code:'1234ABCDEF',mode:'closed',photo:'assets/home/sophie.webp'}],incoming:[],outgoing:[]};
 const rows=[{id:'parcel1',sender:'Owen',code:'ABCDEF1234',kind:'a sticker',sent:true,status:'sent',when:now-300000,created:now-300000,delivery:receipt},{id:'reply-parcel1',originalId:'parcel1',sender:'Owen',senderCode:'ABCDEF1234',isReply:true,remote:true,kind:'Reply',text:'Hi Nicole! This is a simulated reply.',status:'received',when:now-50000,created:now-50000}];
 const read=new Set(),fetchOriginal=fetch.bind(window);
 window.fetch=(input,options={})=>{const u=new URL(typeof input==='string'?input:input.url,location.href);if(u.pathname.includes('/api/catalogue/'))return Promise.resolve(Response.json({items:[],categories:['Photos','Notes','Flowers','Stickers','Reminders','Postcards','Love notes'].map(name=>({name})),avatars:{hidden:[]},more:false}));return fetchOriginal(input,options);};
 const log=value=>parent.postMessage({type:'receipt-fixture',value},location.origin);
 window.Pigeon={mailbox:()=>JSON.stringify(rows),friendsCached:()=>JSON.stringify(book),wasRead:id=>read.has(id),markRead:id=>{read.add(id);log('Unread badge cleared: '+id);},isOpen:()=>true,receiving:()=>{},name:()=>{},setTheme:()=>{},designPaired:()=>false,deliveryPrefs:()=>JSON.stringify({appVersion:'0.1.46',receiptTracking:true,fullPopup:true,notifications:true}),post:(ticket,op,raw)=>{
  const body=JSON.parse(raw);let data=book;
  if(op==='receipt')data={...receipt,reply:'A simulated reply'};
  if(op==='seen'){const row=rows.find(r=>r.id===body.id);if(row)row.seenAt=Date.now();data={ok:true};log('Opening confirmation: '+body.id);}
  if(op==='profile')data={ok:true};
  queueMicrotask(()=>window.postOfficeResult(ticket,JSON.stringify({data})));
 }};
})();
</script><script type="module" src="app.js?v=hanging-sign-2"></script>
