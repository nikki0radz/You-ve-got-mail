<!doctype html><html><head><meta charset="utf-8"><title>Reply loading checks</title><style>body{font:16px system-ui;background:#dce7e0;color:#203a30}iframe{width:390px;height:780px;border:1px solid #738c7c}button{padding:12px;margin:4px}</style></head><body><button id="run">Check reply loading</button><p id="result">Ready · simulated mail only</p><iframe title="Phone app" src="mail-status-app.html?case=picture&loading=1"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
const assert=(v,m)=>{if(!v)throw Error(m);},tick=()=>new Promise(requestAnimationFrame);
const until=async(fn)=>{for(let i=0;i<240;i++){if(fn())return;await tick();}throw Error('Timed out waiting for screen');};
document.querySelector('#run').onclick=async()=>{
 try{
  const w=frame.contentWindow,d=w.document;
  await until(()=>d.querySelector('[data-home-send]:not([disabled])'));
  d.querySelector('[data-action=tab][data-id=inbox]').click();await until(()=>d.querySelector('[data-row="cached-text"]'));
  const {fitPreview}=await w.eval("import("+JSON.stringify(new URL('shop/preview-image.mjs',d.baseURI).href)+")"),{composeFrom}=await w.eval("import("+JSON.stringify(new URL('post/mailbox.mjs',d.baseURI).href)+")");
  for(const width of [320,430]){
   frame.style.width=width+'px';await tick();
   for(const theme of ['light','dark']){
    d.documentElement.dataset.theme=theme;
    let before=w.fixtureReceiptRequests;
    d.querySelector('[data-row="cached-text"]').click();await until(()=>d.querySelector('.received-reply')?.textContent==='Saved text reply');
    assert(w.fixtureReceiptRequests===before,'Saved text waited for network');d.querySelector('#mail-window [data-x]').click();
    // Hold one thumbnail job: opening a picture must still finish before it.
    const host=d.createElement('div');host.className='parcel-thumb';const thumb=d.createElement('img');host.append(thumb);d.body.append(host);thumb.src=new URL('assets/guest/105.svg',d.baseURI).href;
    let release;thumb.decode=()=>new Promise(resolve=>{release=resolve;});fitPreview(thumb);await until(()=>release);
    let monitoring=true,wrongSize=false,firstImage=false;
    const inspect=()=>{const image=d.querySelector('#mail-window .mail-art-stage img');if(image&&w.getComputedStyle(image).visibility==='visible'){firstImage=true;const box=d.querySelector('#mail-window').getBoundingClientRect();if(Math.abs(box.width-width)>2)wrongSize=true;}if(monitoring)w.requestAnimationFrame(inspect);};w.requestAnimationFrame(inspect);
    d.querySelector('[data-row="cached-picture"]').click();await until(()=>d.querySelector('.mail-art-stage img')&&w.getComputedStyle(d.querySelector('.mail-art-stage img')).visibility==='visible');await tick();
    assert(w.fixtureReceiptRequests===before,'Saved picture waited for network');assert(firstImage&&!wrongSize,'Picture appeared in a small popup first');
    assert(!d.querySelector('#mail-window .mail-opening'),'Dots remained after image ready');const retry=d.querySelector('[data-mb=retry-reply]').getBoundingClientRect(),back=d.querySelector('[data-mb=done]').getBoundingClientRect();assert(Math.abs(retry.top-back.top)<2&&retry.right<back.left,'Reply buttons are not on one row');monitoring=false;release?.();host.remove();d.querySelector('#mail-window [data-x]').click();
    d.querySelector('[data-row="reply-parcel1"]').click();await until(()=>d.querySelector('.mail-loading-dots'));
    const dots=d.querySelectorAll('.mail-loading-dots i');assert(dots.length===3,'Missing three dots');assert(w.getComputedStyle(dots[0]).animationName==='mail-loading-dot','Dots do not animate');
    assert(!w.fixtureSeen.includes('reply-parcel1')||before>0,'Loading alone reported seen');
    await until(()=>d.querySelector('.mail-art-stage img')&&w.getComputedStyle(d.querySelector('.mail-art-stage img')).visibility==='visible');
    assert(d.querySelector('.mail-art-stage img').src.startsWith('data:image/png;base64,'),'Repair lost downloaded picture');d.querySelector('#mail-window [data-x]').click();
   }
   const c=d.createElement('canvas');c.width=c.height=100;c.getContext('2d').fillRect(0,0,100,100);
   await composeFrom('Stickers',()=>{},{image:c.toDataURL(),name:'Simulated sticker'});
   const target=d.querySelector('[data-target]');target.value='ABCDEF1234';target.dispatchEvent(new w.Event('change'));
   d.querySelector('[data-mb=send]').click();await until(()=>d.querySelector('.dispatch-complete-actions [data-mb=check-delivery]'));
   const check=d.querySelector('[data-mb=check-delivery]').getBoundingClientRect(),done=d.querySelector('[data-mb=done]').getBoundingClientRect();
   assert(Math.abs(check.top-done.top)<2&&check.right<done.left,'Check status and Done are not on one row');d.querySelector('[data-mb=done]').click();
  }
  d.querySelector('[data-row="reply-parcel1"]').click();await until(()=>d.querySelector('.mail-loading-dots'));d.querySelector('#mail-window [data-x]').click();await new Promise(resolve=>setTimeout(resolve,550));assert(!d.querySelector('#mail-window').open,'Finished download reopened a closed reply');
  result.textContent='PASS · 320/430px, light/dark; saved replies open without network; full picture bypasses blocked thumbnails; three moving dots; first visible image is full size; recovery works; closed replies stay closed; both button pairs share one row.';
 }catch(e){result.textContent='FAIL · '+e.message;}
};
</script></body></html>
