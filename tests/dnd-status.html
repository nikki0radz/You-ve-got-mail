<!doctype html><html><head><meta charset="utf-8"><title>DND status checks</title><style>body{font:16px system-ui;background:#dce7e0;color:#203a30}iframe{width:390px;height:820px;border:1px solid #738c7c}button{padding:12px}</style></head><body><button id="run">Check DND status</button><p id="result">Ready · simulated phones only</p><iframe title="Phone app" src="mail-status-app.html?case=dnd"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),assert=(v,m)=>{if(!v)throw Error(m);},tick=()=>new Promise(requestAnimationFrame);
async function until(fn){for(let i=0;i<700;i++){if(fn())return;await tick();}throw Error('Timed out waiting for DND screen');}
document.querySelector('#run').onclick=async()=>{try{
 const w=frame.contentWindow,d=w.document;await until(()=>d.querySelector('[data-home-send]:not([disabled])'));const {refreshFriends,composeFrom}=await w.eval('import('+JSON.stringify(new URL('post/mailbox.mjs',d.baseURI).href)+')');
 d.querySelector('[data-action=tab][data-id=inbox]').click();await until(()=>d.querySelector('[data-people-toggle]'));d.querySelector('[data-people-toggle]').click();assert(d.querySelector('[data-friend="ABCDEF1234"]').textContent.includes('Phone DND on · last reported'),'DND missing from Your people');
 d.querySelector('[data-friend="ABCDEF1234"]').click();await until(()=>d.querySelector('.friend-profile'));const fact=()=>[...d.querySelectorAll('.friend-profile dl>div')].find(n=>n.querySelector('dt').textContent==='Phone Do Not Disturb')?.querySelector('dd').textContent;
 for(const width of [320,430])for(const theme of ['light','dark']){frame.style.width=width+'px';d.documentElement.dataset.theme=theme;await tick();assert(fact()==='On · last reported','DND status is not qualified');assert(d.querySelector('#mail-window').scrollWidth<=d.querySelector('#mail-window').clientWidth+1,'DND profile overflows');}
 w.fixtureDnd(false);await refreshFriends();await until(()=>fact()==='Off · last reported');w.fixtureDnd(undefined);await refreshFriends();await until(()=>fact()==='Not reported');w.fixtureDnd(true);await refreshFriends();await until(()=>fact()==='On · last reported');d.querySelector('#mail-window [data-x]').click();await tick();
 d.querySelector('[data-folder=sent]').click();d.querySelector('[data-row=parcel1]').click();await until(()=>d.querySelector('.delivery-status strong')?.textContent.includes('waiting for their phone'));assert(!d.querySelector('.mail-seen'),'DND guessed seen');w.fixtureDeliveryPhase=1;await until(()=>d.querySelector('.delivery-status strong')?.textContent.includes('Delivered to phone'));assert(!d.querySelector('.mail-seen'),'Notification under DND incorrectly counted as seen');d.querySelector('#mail-window [data-x]').click();await tick();
 const c=d.createElement('canvas');c.width=c.height=50;c.getContext('2d').fillRect(0,0,50,50);await composeFrom('Stickers',()=>{},{image:c.toDataURL(),name:'DND preview'});const target=d.querySelector('[data-target]');target.value='ABCDEF1234';target.dispatchEvent(new w.Event('change'));assert(d.querySelector('[data-recipient-mail-status]').textContent.includes('Phone DND on · last reported'),'Send flow does not explain DND');d.querySelector('#mail-window [data-x]').click();await tick();
 d.querySelector('[data-action=tab][data-id=settings]').click();d.querySelector('[data-section=account]').open=true;const share=d.querySelector('[data-pref=shareDnd]');assert(share.checked,'Sharing setting missing');share.checked=false;share.dispatchEvent(new w.Event('change',{bubbles:true}));assert(w.fixturePrefs.shareDnd===false&&d.querySelector('[data-dnd-state]').textContent.includes('Not shared'),'DND sharing cannot be disabled');
 result.textContent='PASS · DND on/off/unknown; Your people and send screen show last reported status; open profile updates; DND never fakes delivery; real notification confirmation means delivered without seen; sharing toggle; 320/430px light/dark. Simulated phones only.';
 }catch(e){result.textContent='FAIL · '+e.message;}};
</script></body></html>
