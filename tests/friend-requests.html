<!doctype html><html><head><meta charset="utf-8"><title>Friend request regression checks</title><style>body{background:#eee8d9;color:#203936;font:15px system-ui}main{display:flex;gap:26px}iframe{height:780px;border:2px solid #365a40;background:#faf4e5}button{padding:7px;margin:4px}output{display:block;max-width:390px;overflow-wrap:anywhere}h2{margin:8px}</style></head><body><h1>Friend request checks</h1><p>Local fixture only · no real accounts, requests or phone notifications.</p><main><section><h2>Reference phone</h2><div><button data-case="primary" data-command="empty">Empty friends</button><button data-case="primary" data-command="incoming">Incoming request</button><button data-case="primary" data-command="busy">Busy editor</button><button data-case="primary" data-command="reopen">Reopen app</button></div><iframe title="Reference phone" id="primary" width="390" src="friend-requests-app.html?case=primary"></iframe><output id="log-primary"></output></section><section><h2>Narrow phone</h2><div><button data-case="narrow" data-command="empty">Empty friends</button><button data-case="narrow" data-command="incoming">Incoming request</button><button data-case="narrow" data-command="busy">Busy editor</button><button data-case="narrow" data-command="reopen">Reopen app</button></div><iframe title="Narrow phone" id="narrow" width="320" src="friend-requests-app.html?case=narrow"></iframe><output id="log-narrow"></output></section></main><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>document.getElementById(button.dataset.case).contentWindow.postMessage({type:'fixture-command',command:button.dataset.command},location.origin);addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='fixture-log')document.getElementById('log-'+e.data.caseName).textContent=e.data.value;});</script></body></html>
