<!doctype html><html><head><meta charset="utf-8"><title>Carousel and reply regression</title><style>body{font:16px system-ui;background:#dce7e0;color:#203a30}iframe{width:390px;height:780px;border:1px solid #738c7c}button{padding:12px;margin:4px}</style></head><body><button id="run">Check carousel and picture recovery</button><p id="result">Ready · simulated mail only</p><iframe title="Phone app" src="mail-status-app.html?case=picture"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
const assert=(v,m)=>{if(!v)throw Error(m);};
const tick=()=>new Promise(requestAnimationFrame),until=async(fn)=>{for(let i=0;i<180;i++){if(fn())return;await tick();}throw Error('Timed out waiting for screen');};
document.querySelector('#run').onclick=async()=>{
 try{
  const w=frame.contentWindow,d=w.document;
  await until(()=>d.querySelector('[data-home-send]:not([disabled])'));
  const rail=d.querySelector('.category-reel'),chosen=rail.querySelector('[aria-current=true]');
  chosen.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await tick();await tick();
  const category=rail.querySelector('[aria-current=true]').dataset.category;
  for(const width of [320,430]){
   frame.style.width=width+'px';await tick();await tick();
   for(let n=0;n<3;n++){
    d.querySelector('[data-action=tab][data-id=inbox]').click();await tick();
    d.querySelector('[data-action=tab][data-id=home]').click();await tick();await tick();
    const active=d.querySelector('.category-reel [aria-current=true]'),r=d.querySelector('.category-reel').getBoundingClientRect(),a=active.getBoundingClientRect();
    assert(active.dataset.category===category,'Chosen category changed after returning');
    assert(Math.abs(a.left+a.width/2-r.left-r.width/2)<2,'Selected circle is off centre at '+width);
    assert(Number(active.style.getPropertyValue('--orb-alpha'))>.99,'Selected circle stayed faded');
   }
   // Simulate the browser dropping scroll position while the document is hidden.
   Object.defineProperty(d,'hidden',{configurable:true,value:true});
   d.querySelector('.category-reel').scrollLeft=0;d.dispatchEvent(new w.Event('visibilitychange'));await tick();
   Object.defineProperty(d,'hidden',{configurable:true,value:false});d.dispatchEvent(new w.Event('visibilitychange'));await tick();await tick();
   assert(d.querySelector('.category-reel [aria-current=true]').dataset.category===category,'Background return lost category');
  }
  d.querySelector('[data-action=tab][data-id=inbox]').click();await tick();
  for(const theme of ['dark','light']){
   d.documentElement.dataset.theme=theme;
   const toggle=d.querySelector('.people-toggle'),style=w.getComputedStyle(toggle);
   assert(style.backgroundColor==='rgba(0, 0, 0, 0)'&&style.boxShadow==='none'&&style.borderTopWidth==='0px','Your people has a box in '+theme);
  }
  d.querySelector('[data-row="reply-parcel1"]').click();
  await until(()=>d.querySelector('#mail-window .mail-proof')?.naturalWidth);
  const dialog=d.querySelector('#mail-window');assert(dialog.querySelector('.mail-proof').src.startsWith('data:image/png;base64,'),'Picture was not fetched');
  assert(!dialog.querySelector('.received-reply'),'Missing text became null');
  assert(dialog.querySelector('[data-mb=retry-reply]'),'No refresh recovery action');
  result.textContent='PASS · 320/430px; repeated navigation; background scroll loss; selected category centred and bright; plain Your people in both themes; cached null replaced with downloaded picture.';
 }catch(e){result.textContent='FAIL · '+e.message;}
};
</script></body></html>
