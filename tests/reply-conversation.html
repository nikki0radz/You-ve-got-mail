<!doctype html><html><head><meta charset="utf-8"><title>Reply conversation checks</title><style>body{font:16px system-ui;background:#dce7e0;color:#203a30}iframe{width:390px;height:820px;border:1px solid #738c7c}button{padding:12px}</style></head><body><button id="run">Check reply conversations</button><p id="result">Ready · simulated mail only</p><iframe title="Phone app" src="mail-status-app.html?case=conversation"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),assert=(v,m)=>{if(!v)throw Error(m);},tick=()=>new Promise(requestAnimationFrame);
async function until(fn){for(let i=0;i<600;i++){if(fn())return;await tick();}throw Error('Timed out waiting for reply flow');}
document.querySelector('#run').onclick=async()=>{try{
 const w=frame.contentWindow,d=w.document;await until(()=>d.querySelector('[data-home-send]:not([disabled])'));d.querySelector('[data-action=tab][data-id=inbox]').click();await until(()=>d.querySelector('[data-row="reply-parcel1"]'));
 assert(d.querySelector('[data-row="reply-parcel1"]').textContent.includes('Hi Nicole!'),'Text reply mislabelled');assert(d.querySelector('[data-row="legacy-picture"]').textContent.includes('Picture reply'),'Legacy image mislabelled as a sticker');assert(d.querySelector('[data-row="photo-reply"]').textContent.includes('Photo reply'),'Photo reply mislabelled');assert(d.querySelector('[data-row="incoming-text"]').textContent.includes('Another normal text message'),'Follow-up text not shown');
 for(const theme of ['light','dark'])for(const width of [320,430]){frame.style.width=width+'px';d.documentElement.dataset.theme=theme;d.querySelector('[data-row="photo-reply"]').click();await until(()=>d.querySelector('.mail-art-stage img')&&w.getComputedStyle(d.querySelector('.mail-art-stage img')).visibility==='visible');const reply=d.querySelector('[data-mb=reply]').getBoundingClientRect(),retry=d.querySelector('[data-mb=retry-reply]').getBoundingClientRect(),back=d.querySelector('[data-mb=done]').getBoundingClientRect();assert(reply.width>width*.7&&reply.bottom<=retry.top,'Reply button not visible above footer');assert(Math.abs(retry.top-back.top)<2&&retry.right<back.left,'Refresh and Back no longer share one row');assert(back.bottom<=frame.clientHeight,'Reply controls overflow phone');d.querySelector('#mail-window [data-x]').click();}
 d.querySelector('[data-row="reply-parcel1"]').click();await until(()=>d.querySelector('.received-reply'));d.querySelector('[data-mb=reply]').click();d.querySelector('[data-mb=text]').click();const field=d.querySelector('textarea');field.value='Hello Owen!\nYes, see you tomorrow 👋';field.dispatchEvent(new w.Event('input'));d.querySelector('[data-mb=back]').click();d.querySelector('[data-mb=text]').click();assert(d.querySelector('textarea').value===field.value,'Back lost draft');
 w.fixtureSendError=true;w.fixtureSendDelay=300;d.querySelector('[data-mb=send]').click();await until(()=>d.querySelector('[data-mb=send] .mail-loading-dots'));await until(()=>d.querySelector('.mb-error')?.textContent.includes('offline'));assert(!d.querySelector('[data-mb=send]').disabled,'Failed send stayed disabled');const failed=w.fixturePostLog.filter(x=>x.op==='send').at(-1).body;assert(d.querySelector('textarea').value===field.value,'Failed send lost draft');w.fixtureSendError=false;d.querySelector('[data-mb=send]').click();await until(()=>d.querySelector('#mail-window h2')?.textContent==='Reply sent');
 const posted=w.fixturePostLog.filter(x=>x.op==='send').at(-1).body;assert(posted.code==='ABCDEF1234'&&posted.recipient==='Owen','Follow-up sent to wrong person');assert(posted.kind==='a text reply'&&posted.text===field.value,'Follow-up is not a normal text reply');assert(posted.image.startsWith('data:image/png;base64,'),'Existing phone has no popup image');assert(posted.receiptSecret===failed.receiptSecret&&/^[a-f0-9]{64}$/.test(posted.receiptSecret),'Retry did not reuse receipt token');const img=new w.Image();img.src=posted.image;await img.decode();assert(img.naturalWidth===720&&img.naturalHeight>=280,'Text popup is unreadable');assert(d.querySelector('[data-mb=check-delivery]'),'Follow-up has no delivery status');assert(!w.fixturePostLog.some(x=>x.op==='reply'),'Follow-up overwrote previous reply');d.querySelector('[data-mb=done]').click();await until(()=>d.querySelector('[data-row="reply-parcel1"]'));assert(d.querySelector('[data-row="reply-parcel1"]').textContent.includes('Hi Nicole!'),'Original reply lost');
 // A normal text follow-up can itself receive another normal reply.
 d.querySelector('[data-row="incoming-text"]').click();await until(()=>d.querySelector('.received-reply')?.textContent==='Another normal text message');assert(!d.querySelector('.mail-art-stage'),'Normal text opened as a sticker');d.querySelector('[data-mb=reply]').click();d.querySelector('[data-mb=text]').click();d.querySelector('textarea').value='And another reply';d.querySelector('[data-mb=send]').click();await until(()=>d.querySelector('#mail-window h2')?.textContent==='Reply sent');const again=w.fixturePostLog.filter(x=>x.op==='reply').at(-1);assert(again.body.id==='incoming-text'&&again.body.text==='And another reply','Cannot reply to follow-up message');
 // A photo follow-up goes through the actual frame upload/editor, without
 // changing the original received picture or claiming it was a sticker.
 d.querySelector('[data-mb=done]').click();d.querySelector('[data-row="photo-reply"]').click();await until(()=>d.querySelector('[data-mb=reply]'));d.querySelector('[data-mb=reply]').click();d.querySelector('[data-mb=sticker]').click();await until(()=>d.querySelector('#parcel-shop .category-reel [aria-current=true]'));let category=d.querySelector('#parcel-shop [data-category=Photos]');category.click();await until(()=>d.querySelector('#parcel-shop [data-category=Photos][aria-current=true]'));d.querySelector('#parcel-shop [data-category=Photos][aria-current=true]').click();await until(()=>d.querySelector('.frame-use'));d.querySelector('.frame-use').click();await until(()=>d.querySelector('#parcel-shop [data-upload]'));
 const blob=await (await w.fetch(w.fixtureOwnPhoto)).blob(),transfer=new w.DataTransfer();transfer.items.add(new w.File([blob],'photo.png',{type:'image/png'}));const upload=d.querySelector('#parcel-shop input[type=file]');upload.files=transfer.files;upload.dispatchEvent(new w.Event('change'));await until(()=>d.querySelector('#parcel-shop [data-ok]'));d.querySelector('#parcel-shop [data-ok]').click();await until(()=>d.querySelector('[data-tool=ready]'));d.querySelector('[data-tool=ready]').click();await until(()=>d.querySelector('#mail-window [data-mb=send]'));d.querySelector('#mail-window [data-mb=send]').click();await until(()=>d.querySelector('#mail-window h2')?.textContent==='Reply sent');const photo=w.fixturePostLog.filter(x=>x.op==='send').at(-1).body;assert(photo.kind==='a photo reply'&&photo.text==='Photo reply'&&photo.code==='ABCDEF1234','Photo follow-up classified incorrectly');assert(photo.image.startsWith('data:image/png;base64,'),'Photo follow-up lost artwork');
 result.textContent='PASS · Text/photo/legacy labels correct; reply to a reply sends a new message to its author; original retained; retry token and draft retained; normal text can receive another reply; actual framed photo follow-up classified correctly; real PNG for existing phones; delivery status; buttons fit 320/430px light/dark. Simulated mail only.';
 }catch(e){result.textContent='FAIL · '+e.message;}};
</script></body></html>
