<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation review · Pigeon Post</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae3cf;color:#294938;font:600 15px/1.4 system-ui}
main{display:flex;flex-direction:column;align-items:center;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:7px;flex:none;width:100%;background:#faf4e5;border-bottom:1px solid #b8ac8e}
button{border:1px solid #819880;border-radius:25px;min-height:40px;min-width:44px;background:#e0ead9;color:#294938;font:700 17px system-ui;cursor:pointer}button:disabled{opacity:.45}button:focus-visible{outline:3px solid #416f91}
output{font-variant-numeric:tabular-nums;min-width:4ch;text-align:center}.stage{width:100%;min-height:0;flex:1;display:flex;justify-content:center}
iframe{border:0;display:block;flex:none;background:#eae3cf;transform-origin:top center}
</style></head>
<body><main><header><span>Preview zoom</span><button id="less" aria-label="Zoom out">−</button><output id="size" aria-live="polite"></output><button id="more" aria-label="Zoom in">+</button></header>
<div class="stage"><iframe title="Interactive guest invitation" src="guest.html?preview=1"></iframe></div></main>
<script>
const stage=document.querySelector('.stage'),frame=stage.querySelector('iframe'),less=document.querySelector('#less'),more=document.querySelector('#more'),size=document.querySelector('#size');
const stops=[1,1.25,1.5,1.75,2,2.5,3];let index=4;
function fit(){
 const width=Math.min(390,stage.clientWidth),scale=Math.min(stops[index],stage.clientWidth/width);
 frame.style.width=width+'px';frame.style.height=(stage.clientHeight/scale)+'px';frame.style.transform='scale('+scale+')';
 size.value=Math.round(scale*100)+'%';less.disabled=scale<=1;more.disabled=index===stops.length-1||scale>=stage.clientWidth/width;
}
less.onclick=()=>{const current=parseFloat(size.value)/100;index=Math.max(0,stops.findLastIndex(v=>v<current));fit()};
more.onclick=()=>{index=Math.min(stops.length-1,index+1);fit()};
new ResizeObserver(fit).observe(stage);fit();
</script></body></html>
