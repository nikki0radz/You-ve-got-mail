<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111c19">
  <meta name="description" content="A tiny pigeon. A minor inconvenience. Send playful parcels to your friends.">
  <title>You've Got Mail</title>
  <link rel="icon" type="image/webp" href="assets/pigeon.webp">
  <link rel="stylesheet" href="post/loading.css">
  <link rel="stylesheet" href="styles.css?v=parcel-android-1">
  <link rel="stylesheet" href="shop/shop.css?v=2">
  <link rel="stylesheet" href="design/phone-home.css"><link rel="stylesheet" href="post/post.css"><link rel="stylesheet" href="shop/studio.css"><link rel="stylesheet" href="post/mailbox.css"><link rel="stylesheet" href="post/settings.css"><link rel="stylesheet" href="post/home-fit.css?v=hanging-sign-2">
  <link rel="stylesheet" href="design/live-review.css">
  <link rel="stylesheet" href="post/review-019.css">
  <link rel="stylesheet" href="post/review-020.css">
  <link rel="stylesheet" href="post/review-022.css"><link rel="stylesheet" href="post/review-025.css"><link rel="stylesheet" href="post/review-026.css">
<link rel="stylesheet" href="shop/art-upload.css"><link rel="stylesheet" href="post/review-032.css"><link rel="stylesheet" href="post/review-036.css">
<link rel="stylesheet" href="post/review-039.css">
<link rel="stylesheet" href="post/review-040.css">
<link rel="stylesheet" href="post/review-041.css">
<link rel="stylesheet" href="post/performance.css">
<link rel="stylesheet" href="post/friends.css">
</head>
<body>
  <style>
    #app-loading{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:14px;padding:28px;text-align:center;background:var(--mm-bg,#fff9ed);color:var(--mm-text,#203936);font:800 21px/1.4 PostalBaloo,system-ui}
    #app-loading button{padding:10px 24px;background:#365a40;color:#fff9e8;border:0;border-radius:24px;font:inherit}
  </style>
  <div id="app-loading" role="status" aria-live="polite"><span class="mail-loading-dots boot-dots" aria-hidden="true"><i></i><i></i><i></i></span><span data-boot-message>Opening the post office…</span><button type="button" hidden onclick="location.reload()">Try again</button></div>
  <main id="app" class="mm-phone" aria-label="You've Got Mail" aria-busy="true" inert></main>
  <script>setTimeout(function(){var screen=document.getElementById('app-loading');if(!screen)return;var app=document.getElementById('app');if(app.childElementCount){screen.remove();app.inert=false;app.removeAttribute('aria-busy');}else{screen.querySelector('[data-boot-message]').textContent='The post office could not open. Please try again.';screen.querySelector('.boot-dots').hidden=true;screen.querySelector('button').hidden=false;}},12000);</script>
  <dialog id="flow" aria-labelledby="flow-title"></dialog>
  <dialog id="mail-window" aria-label="Mailbox"></dialog>
  <dialog id="social-flow" aria-label="Pigeon post"></dialog>
  <dialog id="parcel-shop" aria-label="Pick and post"></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=hanging-sign-2"></script>
  <script type="module" src="design/live-review.mjs"></script>
</body>
</html>
