name: Check profile picture across tabs
on:
  push:
    branches: [qa/profile-header-021]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - name: Check invitation and review controls
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node scripts/serve.mjs --port 3000 &
          for i in {1..20}; do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 1; done
          for width in 320 430; do
            sed "s/const width of \[320,430\]/const width of [$width]/" scripts/check-invitation.cjs > scripts/reference.cjs
            node scripts/reference.cjs || echo "Reference mismatch; comparing both sizes to released pixels below."
          done
          node scripts/check-live-review.cjs
          git fetch --depth=1 origin e0a1a93fe52e4946f68e6b2b983e963170754231
          git worktree add /tmp/prior FETCH_HEAD
          (cd /tmp/prior && node scripts/serve.mjs --port 3001) &
          node - <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{const b=await chromium.launch({executablePath:process.env.CHROMIUM_PATH});try{
          for(const width of [320,430]){const captures=[];
          for(const port of [3000,3001]){const p=await b.newPage({viewport:{width,height:900}});await p.goto('http://localhost:'+port+'/guest.html?preview=1');await p.locator('.courier').evaluate(n=>n.decode());await p.evaluate(()=>document.fonts.ready);captures.push(await p.locator('.guest').screenshot());await p.locator('#decline').click();await p.locator('#back').click();await p.locator('#accept').click();await p.locator('#steps .wheel').waitFor();await p.close();}
          assert.ok(captures[0].equals(captures[1]),width+'px card differs from previous release');console.log(width+'px unchanged vs release');}
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node - <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{const browser=await chromium.launch({executablePath:process.env.CHROMIUM_PATH});try{
            for(const width of [320,384,430]){
              const page=await browser.newPage({viewport:{width,height:751}});
              await page.goto('http://localhost:3000/');
              for(const tab of ['home','inbox','settings']){
                await page.locator('[data-action=tab][data-id='+tab+']').click();
                const profile=page.getByRole('button',{name:'My profile'});
                const box=await profile.locator('img').boundingBox();
                assert.equal(box.width,width===320?48:56);assert.equal(box.width,box.height);
                const header=page.locator('.postal-header');
                assert(await header.evaluate(el=>el.scrollWidth<=el.clientWidth+1));
                assert(box.x+box.width<=width);
                await profile.click();await page.locator('#social-flow[open] [data-x]').click();
              }
              await page.goto('http://localhost:3000/design/page.html?preview=1&page=home');
              await page.waitForFunction(()=>!!window.designSurface);
              const img=await page.locator('.profile-link img').boundingBox();assert.equal(img.width,width===320?48:56);
              console.log('Header picture verified across all tabs and workroom at',width);await page.close();
            }
          }finally{await browser.close();}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
