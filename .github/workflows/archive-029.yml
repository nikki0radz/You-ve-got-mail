name: Check archived Android installer
on:
  push:
    branches: [release/archive-android-029]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public archive download
        run: |
          set -euo pipefail
          file=Youve-Got-Mail-0.1.29.apk
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/android-0.1.29/$file"
          curl --retry 3 --retry-all-errors --fail --silent --show-error --location "$url?download=1" -o "$file"
          echo "0a003f0ae99616eaec07ab1a102f3bfef5170fa3dcda2bd7dbaddf7ac708825d  $file" | sha256sum -c -
