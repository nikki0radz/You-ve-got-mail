name: Verify Android download mirrors
on:
  push:
    branches: [release/archive-android-029]
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Check released download responses
        run: |
          file=Youve-Got-Mail-0.1.29.apk
          site=https://pigeon-post-delivery.nikki0radz.chatgpt.site
          for url in "https://github.com/$GITHUB_REPOSITORY/releases/download/android-0.1.29/$file" "$site/downloads/Youve-Got-Mail-0.1.28.apk" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/723610133"; do
            curl -sSL --max-time 30 -H 'Accept: application/octet-stream' -w 'HTTP %{http_code}; downloaded %{size_download} bytes\n' "$url" -o test.apk
            sha256sum test.apk
          done
