name: Mailbox regression
on:
  push:
    branches: [qa/mailbox-027]
permissions:
  contents: read
  statuses: write
jobs:
  mailbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=mailbox-027 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Check Android bridge fixtures and browser mailbox
        run: |
          python -m venv /tmp/pw
          /tmp/pw/bin/pip -q install playwright
          /tmp/pw/bin/python scripts/mailbox-027.py
      - name: Record outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=mailbox-027 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
