name: Verify Android gallery update downloads
on:
  push:
    branches: [release/archive-android-030]
permissions:
  contents: read
jobs:
  downloads:
    strategy:
      fail-fast: false
      matrix:
        version: ["0.1.31", "0.1.30"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download published installers and verify signed bytes
        run: |
          set -euo pipefail
          version=${{ matrix.version }}
          curl --max-time 40 --retry 2 --retry-all-errors -fsSL -H 'Accept: application/octet-stream' "https://pigeon-post-delivery.nikki0radz.chatgpt.site/downloads/Youve-Got-Mail-$version.apk" -o "$version.apk"
          if [ "$version" = 0.1.31 ]; then
            expected=d7b2fa088bbb394552f347707453afdffcb19123f76e5408e35f60f7a72d2d5c
          else
            expected=dab79cf7aff56a97a77904d77c8e2e92cdd1a53af35815afa3e276804da3540e
          fi
          echo "$expected  $version.apk" | sha256sum -c -
          curl --max-time 15 --retry 2 -fsS "https://pigeon-post-delivery.nikki0radz.chatgpt.site/workroom/latest.json" | jq -e '.version=="0.1.31" and .code==32'
          curl --max-time 15 --retry 2 -fsS "https://pigeon-post-delivery.nikki0radz.chatgpt.site/api/catalogue/items" | jq -e '.categories | type=="array"'
