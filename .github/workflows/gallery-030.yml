name: Android gallery batch test
on:
  push:
    branches: [qa/gallery-result-bytes-031]
    paths: ['android/tests/gallery-030.js', 'android/tests/gallery-030.py', '.github/workflows/gallery-030.yml']
permissions:
  contents: read
  statuses: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Register emulator check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=gallery-staged-bytes-031 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          ref: 2d513bc2af6ba3953b978225db700c292271fd1c
          path: release-web
      - name: Build a disposable APK using the release WebView
        run: |
          set -eu
          python - <<'PY'
          from pathlib import Path
          p=Path('android/src/uk/co/pigeonpost/mail/Main.java')
          s=p.read_text().replace('    private boolean launchPhotoPicker(Intent intent){', '''    private final LinkedHashSet<Uri> qaUris=new LinkedHashSet<>();
              private boolean launchPhotoPicker(Intent intent){
                  // Test runner grants these two actual MediaStore URIs via Intents.
                  if(qaUris.size()==2 && intent.hasExtra(MediaStore.EXTRA_PICK_IMAGES_MAX)){
                      Iterator<Uri> it=qaUris.iterator();
                      ClipData clip=ClipData.newUri(getContentResolver(),"QA fixture",it.next());
                      clip.addItem(new ClipData.Item(it.next()));
                      Intent result=new Intent().addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);result.setClipData(clip);
                      web.post(()->onActivityResult(41,RESULT_OK,result));
                      return true;
                  }''').replace('    private void incoming(Intent i){', '''    private void incoming(Intent i){
                  if(i.getData()!=null && "content".equals(i.getData().getScheme()))qaUris.add(i.getData());''')
          p.write_text(s)
          PY
          cp shop/art-upload.mjs "$RUNNER_TEMP/tested-manager.mjs"
          cp -r release-web/shop/. shop/
          cp "$RUNNER_TEMP/tested-manager.mjs" shop/art-upload.mjs
          test "$(git hash-object shop/art-upload.mjs)" = 0c42f90223d31eb780ef5f9a8d5d87bdffef4e0f
          python - <<'PY'
          from pathlib import Path
          fixture=Path('android/tests/gallery-030.js').read_text().replace("note.textContent=s;","note.textContent=s;note.scrollIntoView();")
          Path('index.html').write_text('<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="shop/art-upload.css"><script>'+fixture+'</script><button onclick="openManager()">Artwork manager</button><script type="module">import {openArtworkUploads} from "./shop/art-upload.mjs";window.openManager=openArtworkUploads;</script>')
          p=Path('android/tests/gallery-030.py')
          p.write_text(p.read_text().replace("button('Later');button('Settings');","button('Later');"))
          s=p.read_text().replace("for name,data in files.items():","granted=[]\nfor name,data in files.items():").replace(" print('Committed media fixture:',"," if name.endswith('.png'):granted.append(uri)\n print('Committed media fixture:',")
          start=s.index("adb('shell','am','start','-W'")
          end=s.index("digest=' '.join(",start)
          s=s[:start]+"""for grant in granted:
           adb('shell','am','start','-W','-n','uk.co.pigeonpost.mail/.Main','--grant-read-uri-permission','-d',grant)
          button('Later');button('Artwork manager');button('Upload PNGs')
          """+s[end:]
          s=s[:s.index("button('Check single photo')")]+"print('PASS both URI grants and exact source bytes survived the real native result callback and IndexedDB queue.',flush=True)\n"
          p.write_text(s)
          PY
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/qa.p12" -alias pigeonpost -storepass android -keypass android -keyalg RSA -dname "CN=Offline QA" -validity 1
          echo android > "$RUNNER_TEMP/qa.pass"
          MAIL_KEYSTORE="$RUNNER_TEMP/qa.p12" MAIL_PASSWORD_FILE="$RUNNER_TEMP/qa.pass" bash android/build.sh "$GITHUB_WORKSPACE/phone-qa.apk"
      - name: Select two PNGs and read both originals in the gallery and upload manager
        shell: bash
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          manager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          export PATH="$(dirname "$manager"):$ANDROID_HOME/platform-tools:$PATH"
          # Keep room for the system image and writable emulator userdata on this disposable runner.
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet
          df -h /; ls -l /dev/kvm || true
          sdkmanager "system-images;android-35;google_apis;x86_64" "emulator"
          curl -fsSL https://dl.google.com/android/repository/emulator-linux_x64-12414864.zip -o "$RUNNER_TEMP/emu35.zip"
          unzip -q "$RUNNER_TEMP/emu35.zip" -d "$RUNNER_TEMP/pinned"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -f -n PigeonQA -p "$ANDROID_AVD_HOME/PigeonQA.avd" -k "system-images;android-35;google_apis;x86_64" -d pixel_6
          mv "$ANDROID_HOME/emulator" "$RUNNER_TEMP/original-emulator"
          mv "$RUNNER_TEMP/pinned/emulator" "$ANDROID_HOME/emulator"
          test -s "$ANDROID_AVD_HOME/PigeonQA.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/PigeonQA.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/PigeonQA.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd PigeonQA -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -Vulkan -cores 2 -memory 2048 -partition-size 2048 > "$RUNNER_TEMP/pigeon-emulator.log" 2>&1 &
          emu_pid=$!
          trap 'tail -45 "$RUNNER_TEMP/pigeon-emulator.log"' ERR
          for i in {1..60}; do
            kill -0 "$emu_pid"
            if adb devices | grep -q 'emulator-'; then break; fi
            sleep 2
          done
          timeout 120 adb wait-for-device
          for i in {1..150}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell svc wifi disable
          adb shell svc data disable
          python android/tests/gallery-030.py
      - name: Record outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=gallery-staged-bytes-031 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
