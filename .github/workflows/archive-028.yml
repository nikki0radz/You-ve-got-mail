name: Verify Android installer downloads
on:
  push:
    branches: [release/archive-android-028]
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Check both publicly served signed APKs and the live catalogue
        run: |
          set -euo pipefail
          site=https://pigeon-post-delivery.nikki0radz.chatgpt.site
          for version in 0.1.28 0.1.29; do
            curl -fsSL --retry 2 "$site/downloads/Youve-Got-Mail-$version.apk" -o "$version.apk"
          done
          echo '142badb55b65e41cd7055324b5e7ce9954778b4725e88504fc4b3c0ae17a2aa0  0.1.28.apk' | sha256sum -c -
          echo '0a003f0ae99616eaec07ab1a102f3bfef5170fa3dcda2bd7dbaddf7ac708825d  0.1.29.apk' | sha256sum -c -
          curl -fsS "$site/api/catalogue/items" | jq -e '.categories | type == "array"'
