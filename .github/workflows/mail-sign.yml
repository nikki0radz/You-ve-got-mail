name: Check mail signs
on:
  push:
    branches: [qa/hanging-sign-024]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - name: Check invitation and review controls
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node scripts/serve.mjs --port 3000 &
          for i in {1..20}; do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 1; done
          node - <<'JS'
          const assert=require('node:assert/strict'), {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROMIUM_PATH,args:['--no-sandbox']});
            try {
              for(const [width,height] of [[320,640],[384,800],[430,900],[800,400]]){
                const p=await browser.newPage({viewport:{width,height},hasTouch:true,isMobile:true});
                await p.goto(process.env.APP_URL || 'http://localhost:3000/');
                const control=p.getByRole('switch',{name:'Open to mail',exact:true}),art=p.locator('.mail-status-art');
                const status=async open=>{
                  assert.equal(await control.isChecked(),open);
                  await art.evaluate(img=>img.decode());
                  assert.equal(await art.getAttribute('src'),'assets/home/mail-'+(open?'open':'closed')+'.webp');
                  assert.equal(await art.evaluate(img=>img.naturalWidth),1064);
                };
                await status(true);
                const first=await art.boundingBox();
                const shop=await p.locator('.post-office-art').boundingBox();
                const hint=p.getByText('tap to change status',{exact:true});
                const caption=await hint.boundingBox();
                assert(first.width<=shop.width*.78 && first.width<=281 && first.height>=44);
                assert(Math.abs(first.x+first.width/2-shop.x-shop.width/2)<1);
                const ring=first.y+first.height*.13;
                assert(ring>shop.y+shop.height*.91 && ring<shop.y+shop.height*.947, 'Both ring centres must overlap the wooden ledge');
                assert(caption.y>=first.y+first.height-1 && caption.y<=first.y+first.height+4);
                await hint.evaluate(n=>n.scrollIntoView({block:'center',behavior:'instant'}));
                const hit=await hint.boundingBox();
                await p.touchscreen.tap(hit.x+hit.width/2,hit.y+hit.height/2);
                await status(false);await control.tap();await status(true);
                await control.tap();await status(false);
                assert.equal((await art.boundingBox()).height,first.height);
                await p.reload();await status(false);
                await control.focus();await p.keyboard.press('Space');await status(true);
                assert(await control.evaluate(el=>el===document.activeElement));
                const design=p.getByRole('switch',{name:'Design mode'});
                await design.click();
                await p.frameLocator('iframe[title="Paused app screen"]').locator('.mail-toggle').click();
                await p.getByPlaceholder('What would you change here?').waitFor();
                await design.click();await status(true);
                await p.evaluate(()=>{window.nativeCalls=[];window.Pigeon={receiving:open=>window.nativeCalls.push(open)};});
                await control.tap();await control.tap();
                assert.deepEqual(await p.evaluate(()=>window.nativeCalls),[false,true]);
                await p.close();
                console.log(width+'px signs: tap, reload, keyboard, paused review and Android bridge passed');
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
